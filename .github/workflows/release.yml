name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.0. Must match manifest.json version."
        required: true
        type: string
      prerelease:
        description: "Mark GitHub release as prerelease"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate release version
        run: .github/scripts/check-release-version.py "${{ github.event.inputs.tag }}"
      - name: Validate JSON/HACS/docs
        run: |
          .github/scripts/validate-json.sh
          .github/scripts/check-hacs-layout.sh
          .github/scripts/check-docs-frontmatter.py
          .github/scripts/check-markdown-links.py
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[ha-test]'
      - name: Tests
        run: |
          python -m compileall -q custom_components/oldphonekiosk
          pytest -q tests tests_ha

  github-release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
          PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi
          FLAGS="--generate-notes"
          if [ "$PRERELEASE" = "true" ]; then
            FLAGS="$FLAGS --prerelease"
          fi
          gh release create "$TAG" --title "$TAG" $FLAGS
