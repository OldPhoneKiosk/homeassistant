name: HA integration tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Same explicit-minimum permission style as proxy_sembot: checkout only needs repository read access.
permissions:
  contents: read

concurrency:
  group: ha-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, HA-free unit tests for pure protocol/security/store/client logic.
  fast-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Compile custom component
        run: python -m compileall -q custom_components/oldphonekiosk
      - name: Fast tests
        run: pytest -q

  # Full Home Assistant runtime harness: config_flow, coordinator, services and HA service registry behavior.
  ha-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - name: Install HA harness (newest PHACC compatible with 3.12)
        run: |
          pip install "pytest-homeassistant-custom-component<0.14" "qrcode>=7.4"
          python -c "from homeassistant.const import __version__ as v; print('Home Assistant', v)"
          python -c "import pytest_homeassistant_custom_component as p; print('PHACC', p.__version__ if hasattr(p,'__version__') else 'n/a')"
      - name: Compile custom component
        run: python -m compileall -q custom_components/oldphonekiosk
      - name: HA harness tests
        run: pytest tests_ha -q
