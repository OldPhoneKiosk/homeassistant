name: HA integration tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ha-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, HA-free unit tests (Bridge API client + parsing). testpaths=["tests"].
  fast-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest -q

  # Full Home Assistant runtime harness (config_flow / coordinator / service).
  # Runs on Python 3.12 with the newest pytest-homeassistant-custom-component that
  # resolves there (pip backtracks past HA lines that require 3.13). The component
  # keeps a ConfigFlowResult compat shim so it loads across HA versions.
  #
  # The integration package is NOT installed here on purpose: HA pins its own httpx
  # and the component is imported from the repo via sys.path (tests_ha/conftest.py).
  ha-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - name: Install HA harness (newest PHACC compatible with 3.12)
        run: |
          pip install "pytest-homeassistant-custom-component<0.14"
          python -c "from homeassistant.const import __version__ as v; print('Home Assistant', v)"
          python -c "import pytest_homeassistant_custom_component as p; print('PHACC', p.__version__ if hasattr(p,'__version__') else 'n/a')"
      - run: pytest tests_ha -q
