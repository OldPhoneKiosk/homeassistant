name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: .github/scripts/validate-json.sh

  hacs-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: .github/scripts/check-hacs-layout.sh

  docs-frontmatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: .github/scripts/check-docs-frontmatter.py

  docs-freshness:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: .github/scripts/check-docs-freshness.sh "origin/${{ github.base_ref }}"

  tests-freshness:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: .github/scripts/check-tests-freshness.sh "origin/${{ github.base_ref }}"

  changelog-freshness:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: .github/scripts/check-changelog-freshness.sh "origin/${{ github.base_ref }}"

  markdown-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: .github/scripts/check-markdown-links.py
