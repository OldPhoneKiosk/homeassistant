name: Feature request
description: Suggest a new OldPhoneKiosk capability or improvement
title: "Feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to achieve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work in Home Assistant and/or on the iPhone?
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: Success criteria
      description: What would make this feature complete?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: constraints
    attributes:
      label: Privacy/security constraints
      description: Mention if the feature touches camera, microphone, Home Assistant credentials, local network access, or personal data.
