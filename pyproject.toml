[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oldphonekiosk-homeassistant"
version = "0.1.0"
description = "Home Assistant custom integration for OldPhoneKiosk wall panels."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
# Full Home Assistant runtime harness (config_flow/coordinator/service tests in
# tests_ha/). Pinned to the last release that still targets Python 3.11
# (HA 2024.1.4). Install into a SEPARATE venv from `dev` — see README.
ha-test = [
    "pytest-homeassistant-custom-component==0.13.90",
]

[tool.setuptools]
# The integration itself is loaded by Home Assistant from custom_components/.
# This package config exists only to install test/runtime deps for CI.
py-modules = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
