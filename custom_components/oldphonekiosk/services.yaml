pair_new_panel:
  name: Pair a new panel
  description: >-
    Provision a new panel in Home Assistant and return a one-time 10-digit pairing code
    to enter in the OldPhoneKiosk app. Also raises a persistent notification with the code.
  fields:
    name:
      name: Panel name
      description: Display name for the new panel.
      required: true
      example: "Kitchen Panel"
      selector:
        text:
    room:
      name: Room
      description: Optional room/area for the panel.
      required: false
      example: "Kitchen"
      selector:
        text:

start_stream:
  name: Start panel stream
  description: >-
    Start a media publisher session through Home Assistant/go2rtc. Sets the viewer URL and
    tells the panel to publish. Real publishing requires a device build with a
    WebRTC publisher; otherwise the panel reports the stream as "unsupported".
  fields:
    device_id:
      name: Panel device id
      required: true
      example: "b1e7c2a0-..."
      selector:
        text:
    camera_mode:
      name: Camera mode
      required: false
      selector:
        select:
          options: ["front", "back", "dual"]

stop_stream:
  name: Stop panel stream
  description: Stop the panel's media publisher session and clear the viewer URL.
  fields:
    device_id:
      name: Panel device id
      required: true
      example: "b1e7c2a0-..."
      selector:
        text:

set_media:
  name: Set panel media
  description: >-
    Set a panel's media config in Home Assistant: the video/WebRTC player URL (e.g. a
    go2rtc page) shown by the Lovelace card, and/or the camera mode.
  fields:
    device_id:
      name: Panel device id
      description: The panel device id (see the panel's 'bridge_device_id' compatibility attribute).
      required: true
      example: "b1e7c2a0-..."
      selector:
        text:
    video_url:
      name: Video URL
      description: WebRTC/go2rtc player URL (empty to clear).
      required: false
      example: "http://homeassistant.local:1984/stream.html?src=front_door"
      selector:
        text:
    camera_mode:
      name: Camera mode
      required: false
      selector:
        select:
          options: ["off", "front", "back", "dual"]

set_panel_ui:
  name: Set panel UI
  description: >-
    Push Home-Assistant-owned kiosk navigation/config to a panel: the default and
    enabled screens, bottom menu, dashboard URL, and the tasks/photos sources. Only
    provided fields change; they persist and re-apply after a restart.
  fields:
    device_id:
      name: Panel device id
      required: true
      example: "b1e7c2a0-..."
      selector:
        text:
    default_screen:
      name: Default screen
      required: false
      selector:
        select:
          options: ["photos", "tasks", "actions", "dashboard", "home"]
    enabled_screens:
      name: Enabled screens
      required: false
      selector:
        select:
          multiple: true
          options: ["photos", "tasks", "actions", "dashboard", "home"]
    show_bottom_menu:
      name: Show bottom menu
      required: false
      selector:
        boolean:
    dashboard_url:
      name: Dashboard URL
      description: Dashboard the panel shows on the dashboard screen (empty to clear).
      required: false
      selector:
        text:
    task_source:
      name: Task source
      description: Task list id or URL feeding the tasks screen (empty to clear).
      required: false
      selector:
        text:
    photo_source:
      name: Photo source
      description: Photo feed id or URL feeding the photos screen (empty to clear).
      required: false
      selector:
        text:

beep:
  name: Beep panel
  description: Play a short attention beep + haptic on the panel.
  fields:
    device_id:
      name: Panel device id
      required: true
      example: "b1e7c2a0-..."
      selector:
        text:

play_sound:
  name: Play sound
  description: >-
    Play a sound on the panel. Provide a system sound id, a bundled sound name, or a
    remote audio URL. With neither, the panel's stored Sound value is used.
  fields:
    device_id:
      name: Panel device id
      required: true
      example: "b1e7c2a0-..."
      selector:
        text:
    sound:
      name: Sound
      description: System sound id (e.g. 1007), or a bundled sound name.
      required: false
      selector:
        text:
    url:
      name: Audio URL
      description: A remote/local audio URL to play (audio_url).
      required: false
      example: "http://homeassistant.local:8123/local/chime.mp3"
      selector:
        text:

start_intercom:
  name: Start intercom
  description: >-
    Open an intercom session on the panel. Honest MVP: the panel reflects the
    intercom state (ringing/talking) in its UI; live audio capture/streaming is not
    yet implemented, but audio_url/stream_url are carried for a future build.
  fields:
    device_id:
      name: Panel device id
      required: true
      example: "b1e7c2a0-..."
      selector:
        text:
    mode:
      name: Mode
      description: "ring (incoming) or talk (channel open). Default: talk."
      required: false
      selector:
        select:
          options: ["ring", "talk"]
    audio_url:
      name: Audio URL
      required: false
      selector:
        text:
    stream_url:
      name: Stream URL
      required: false
      selector:
        text:

stop_intercom:
  name: Stop intercom
  description: Close the intercom session on the panel (back to idle).
  fields:
    device_id:
      name: Panel device id
      required: true
      example: "b1e7c2a0-..."
      selector:
        text:

revoke_panel:
  name: Revoke panel
  description: >-
    Revoke and remove a panel from OldPhoneKiosk in Home Assistant. The panel must
    re-pair to reconnect.
  fields:
    device_id:
      name: Panel device id
      description: >-
        The OldPhoneKiosk panel device id (NOT the Home Assistant device/registry id). It is
        shown as the 'bridge_device_id' compatibility attribute on any of the panel's entities.
      required: true
      example: "b1e7c2a0-1234-4f56-8abc-0123456789ab"
      selector:
        text:
