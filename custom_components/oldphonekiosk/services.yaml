pair_new_panel:
  name: Pair a new panel
  description: >-
    Provision a new panel on the Bridge and return a pairing QR payload to scan in
    the OldPhoneKiosk app. Also raises a persistent notification with the QR/payload.
  fields:
    name:
      name: Panel name
      description: Display name for the new panel.
      required: true
      example: "Kitchen Panel"
      selector:
        text:
    room:
      name: Room
      description: Optional room/area for the panel.
      required: false
      example: "Kitchen"
      selector:
        text:

set_media:
  name: Set panel media
  description: >-
    Set a panel's media config on the Bridge: the video/WebRTC player URL (e.g. a
    go2rtc page) shown by the Lovelace card, and/or the camera mode.
  fields:
    device_id:
      name: Bridge device id
      description: The Bridge device id (see the panel's 'bridge_device_id' attribute).
      required: true
      example: "b1e7c2a0-..."
      selector:
        text:
    video_url:
      name: Video URL
      description: WebRTC/go2rtc player URL (empty to clear).
      required: false
      example: "http://homeassistant.local:1984/stream.html?src=front_door"
      selector:
        text:
    camera_mode:
      name: Camera mode
      required: false
      selector:
        select:
          options: ["off", "front", "back", "dual"]

revoke_panel:
  name: Revoke panel
  description: >-
    Revoke and remove a panel from the OldPhoneKiosk Bridge (and from Home
    Assistant). The panel must re-pair to reconnect.
  fields:
    device_id:
      name: Bridge device id
      description: >-
        The Bridge device id (NOT the Home Assistant device/registry id). It is
        shown as the 'bridge_device_id' attribute on any of the panel's entities.
      required: true
      example: "b1e7c2a0-1234-4f56-8abc-0123456789ab"
      selector:
        text:
